name: deploy-web

# Builds ALIEN SPACE DROP to WebAssembly and publishes it to GitHub Pages.
#
# After the first run: repo Settings -> Pages -> "Build and deployment" ->
# "Source: GitHub Actions". The game then lives at:
#     https://<your-username>.github.io/<repo-name>/

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown

      # cpal (host-only audio) needs ALSA headers to compile on Linux runners.
      - name: Install ALSA dev files
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Run unit tests (host)
        run: cargo test --release

      - name: Assemble static site
        run: |
          mkdir -p site
          cp web/index.html web/gl.js site/
          cp target/wasm32-unknown-unknown/release/alien-space-drop.wasm site/alien_space_drop.wasm
          ls -la site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4