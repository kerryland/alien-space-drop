<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALIEN SPACE DROP - Apple II hi-res tribute</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #060608;
    color: #3f6;
    font-family: "Menlo", "Consolas", "Courier New", ui-monospace, monospace;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    /* faint CRT barrel vignette so the page frame matches the game */
    background:
      radial-gradient(120% 100% at 50% 50%, #0a0d0b 0%, #040405 100%);
    gap: 10px;
    padding: 10px;
  }
  header {
    font-size: clamp(12px, 2.2vw, 20px);
    letter-spacing: 0.35em;
    text-shadow: 0 0 8px rgba(0, 255, 128, 0.7);
    white-space: pre;
  }
  #wrap {
    position: relative;
    width: min(96vw, calc(96vh * 280 / 192));
    aspect-ratio: 280 / 192;
    background: #000;
    border: 2px solid #1f9a4a;
    box-shadow: 0 0 60px rgba(0, 255, 128, 0.16), inset 0 0 60px rgba(0, 0, 0, 0.8);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    outline: none;
  }
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #3f6;
    font-size: 14px;
    letter-spacing: 0.2em;
    cursor: pointer;
    user-select: none;
  }
  #loading .dot { animation: blink 1s steps(2, start) infinite; }
  footer {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: #285530;
    text-align: center;
  }
  footer b { color: #3f6; font-weight: normal; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
  <header>ALIEN SPACE DROP</header>
  <div id="wrap">
    <div id="loading">
      <span>LOADING<span class="dot">...</span></span>
      <span style="margin-top:12px; font-size:12px; color:#285530;">A / S MOVE&nbsp;&nbsp;D BOOST</span>
    </div>
    <canvas id="glcanvas" tabindex="1"></canvas>
  </div>
  <footer>
    <b>A</b>/<b>S</b> move &middot; <b>D</b> boost &middot; arrows work too &middot; <b>ESC</b> quit<br>
    land on a pad &mdash; the smaller the pad, the more points
  </footer>

  <script src="gl.js"></script>
  <script>
    (function () {
      var canvas = document.getElementById("glcanvas");
      var loading = document.getElementById("loading");

      // Any input starts the game and dismisses the overlay. The wasm's
      // alien_audio_tone() also runs inside this user gesture, which is what
      // lets the AudioContext start (autoplay policy).
      function start() {
        loading.style.display = "none";
        canvas.focus();
      }
      document.addEventListener("keydown", function () { start(); }, { once: true });
      loading.addEventListener("click", function () { start(); });

      window.addEventListener("error", function (e) {
        loading.innerHTML = "LOAD FAILED: " + e.message +
          "<br><span style='font-size:11px;color:#285530'>try serving over http (e.g. npx http-server)</span>";
      });

      load("alien_space_drop.wasm");
    })();
  </script>
</body>
</html>
